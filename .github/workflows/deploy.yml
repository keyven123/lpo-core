name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button for manual redeploys

# Never run two deploys of this app at once; a newer push waits for the current one.
concurrency:
  group: deploy-lpo-core
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build and type-check, so a broken commit never reaches the server.
      # The real API URL is baked in on the server (.env.production.local); this run is only a check.
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on the server
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }} # e.g. deploy@your-server-ip
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}     # /srv/lpo/lpo-core
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_TARGET" "bash '$DEPLOY_PATH/scripts/deploy.sh'"
